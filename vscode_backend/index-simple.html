<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Prompt Studio</title>
<style>
:root {
  --bg: #eef2f7; --card: #f8fafc; --border: #e2e8f0; --input-border: #cbd5e1;
  --title: #1e293b; --label: #334155; --muted: #64748b; --out-bg: #ffffff;
  --primary: #2563eb; --btn-bg: #e2e8f0; --btn-text: #1e293b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0f172a; --card: #1e293b; --border: #334155; --input-border: #475569;
    --title: #f1f5f9; --label: #cbd5e1; --muted: #94a3b8; --out-bg: #0f172a;
    --primary: #3b82f6; --btn-bg: #334155; --btn-text: #f1f5f9;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); font-family: Arial, sans-serif; padding: 16px; }
.container { max-width: 850px; margin: 25px auto; padding: 28px; border-radius: 18px;
  background: var(--card); border: 1px solid var(--border); box-shadow: 0 8px 25px rgba(0,0,0,.08); }
.title { font-size: 28px; font-weight: 700; color: var(--title); margin: 0 0 6px; }
.subtitle { font-size: 14px; color: var(--muted); margin: 0 0 22px; }
label { display: block; font-size: 14px; font-weight: 600; color: var(--label); margin: 14px 0 7px; }
input, textarea { width: 100%; padding: 12px 14px; font-size: 15px; font-family: inherit;
  border-radius: 12px; border: 1px solid var(--input-border); background: var(--out-bg); color: var(--title); }
textarea { min-height: 140px; resize: vertical; }
.buttons { display: flex; gap: 4%; margin-top: 14px; }
button { flex: 1; height: 45px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600;
  cursor: pointer; background: var(--btn-bg); color: var(--btn-text); }
button.primary { background: var(--primary); color: #fff; }
button:disabled { opacity: .6; cursor: not-allowed; }
.status { font-size: 13px; color: var(--muted); margin-top: 10px; }
.output { margin-top: 20px; padding: 18px; min-height: 100px; max-height: 400px; overflow-y: auto;
  background: var(--out-bg); color: var(--title); border: 1px solid var(--border);
  border-radius: 12px; white-space: pre-wrap; line-height: 1.55; font-size: 15px; }
</style>
</head>
<body>
<div class="container">
  <h1 class="title">🤖 AI Prompt Studio</h1>
  <p class="subtitle">Enter your prompt and generate an AI-powered response.</p>

  <label for="backend">🔗 Backend URL (printed by the Colab cell)</label>
  <input id="backend" placeholder="https://something.trycloudflare.com">

  <label for="prompt">💬 Enter Your Prompt</label>
  <textarea id="prompt" placeholder="Ask me anything…"></textarea>

  <div class="buttons">
    <button id="submit" class="primary">Generate Response</button>
    <button id="clear">Clear</button>
  </div>
  <div class="status" id="status">Ready to generate.</div>
  <div class="output" id="output"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const backendEl = $("backend"), promptEl = $("prompt"), submitBtn = $("submit"),
      statusEl = $("status"), outputEl = $("output");

// Remember the backend URL between visits (ignore if storage is unavailable)
try { backendEl.value = localStorage.getItem("backendUrl") || ""; } catch (e) {}

submitBtn.addEventListener("click", async () => {
  const prompt = promptEl.value.trim();
  const base = backendEl.value.trim().replace(/\/+$/, "");

  if (!base) { statusEl.textContent = "Please paste the backend URL first."; return; }
  if (!prompt) { outputEl.textContent = "⚠️ Please enter a prompt first."; statusEl.textContent = "Please enter a prompt."; return; }
  try { localStorage.setItem("backendUrl", base); } catch (e) {}

  submitBtn.disabled = true;
  submitBtn.textContent = "Generating…";
  statusEl.textContent = "⏳ Generating response…";
  outputEl.textContent = "";

  try {
    const res = await fetch(base + "/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt })
    });
    if (!res.ok) throw new Error("Server returned " + res.status);

    // Read the streamed answer piece by piece
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      outputEl.textContent += decoder.decode(value, { stream: true });
      outputEl.scrollTop = outputEl.scrollHeight;
    }
    statusEl.textContent = "✅ Response generated successfully.";
  } catch (err) {
    outputEl.textContent = "❌ Error: " + err.message +
      "\n\nCheck that the Colab cell is still running and the URL is correct.";
    statusEl.textContent = "Something went wrong.";
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Generate Response";
  }
});

$("clear").addEventListener("click", () => {
  promptEl.value = "";
  outputEl.textContent = "";
  statusEl.textContent = "Ready to generate.";
});
</script>
</body>
</html>
